[project]
name = "ai-testcase-generator"
version = "0.1.0"
description = "Generate positive and negative test cases for a website via local ollama LLM"
readme = "README.md"
authors = [
    { name = "Vlad", email = "vladislav.chernov@ligastavok.ru" }
]
requires-python = ">=3.13"
dependencies = [
    "httpx>=0.28",
    "pydantic>=2.11",
]

[project.scripts]
ai-testgen = "ai_testgen.cli:main"

[dependency-groups]
dev = [
    "mypy>=1.14",
    "pytest>=8.3",
    "pytest-mock>=3.14",
    "ruff>=0.9",
]

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "ai_testgen"

[tool.pytest.ini_options]
markers = [
    "integration: requires live ollama service",
]
