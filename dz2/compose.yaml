# Project compose: one image for both fronts (CLI and Streamlit UI). The `ui`
# extra is additive, so `ui` builds it once and `app` reuses the same tag.
#
# Shared components (ollama) come from the infra catalog (../infra/), declared
# in infra.yaml. Do not run a per-project ollama: port 11434 belongs to
# ohw-ollama. Start the stand with the platform scripts:
#   .\scripts\up-gpu.ps1   /   .\scripts\up-cpu.ps1   (Windows)
#   ./scripts/up-gpu.sh                                (Linux/macOS)
# The scripts also add the infra GPU overlay for GPU mode.

x-dz2-image: &dz2-image ohw/dz2:local

services:
  app:
    image: *dz2-image
    restart: "no"
    command: ["--count", "10"]
    environment:
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://ohw-ollama:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5:7b-instruct}
    volumes:
      - ./docs:/data/docs:ro
      - ./input:/data/input
      - ./output:/data/output
      - ./prompts:/app/prompts:ro
      - ./presets:/app/presets:ro
    networks:
      - ohw-net

  # Streamlit workbench: docker compose up -d ui -> http://localhost:8501
  ui:
    image: *dz2-image
    build:
      context: .
      args:
        EXTRAS: "--extra ui"
    restart: "no"
    entrypoint: ["ai-testgen-ui"]
    environment:
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://ohw-ollama:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5:7b-instruct}
    ports:
      - "8501:8501"
    volumes:
      - ./docs:/data/docs:ro
      - ./input:/data/input
      - ./output:/data/output
      - ./prompts:/app/prompts:ro
      - ./presets:/app/presets:ro
    networks:
      - ohw-net

networks:
  ohw-net:
    external: true
    name: ohw_net
