# Настройки нормализатора требований (dz2).
#
# Отдельный файл, а не секция ai-testgen.toml: параметры касаются только
# канонического вида требований. Полный глоссарий по каждому ключу, значения
# по умолчанию и рецепты — NORMALIZER-SETTINGS.md.
#
# Файл читается, если он есть рядом с рабочей директорией проекта.
# Путь можно переопределить флагом --normalizer-config или переменной
# AI_TESTGEN_NORMALIZER_CONFIG. Значения ниже — те же, что были захардкожены
# в normalizer.py до появления этого файла.

# Префикс идентификаторов требований: BR-1, BR-2, ...
id_prefix = "BR"

# Заголовок раздела с требованиями в нормализованном документе.
requirements_heading = "Requirements"

# Подпись строки с URL в нормализованном документе (**URL:** ...).
url_label = "URL"

# Заголовок, если в исходнике не нашлось ни H1, ни короткой первой строки.
fallback_title = "Требования"

# Кодировки, которые пробуются после строгого UTF-8 и BOM.
# Порядок важен: при равном счёте выигрывает первая.
encodings = ["cp1251", "cp866"]

# Минимальная длина абзаца, который считается требованием в fallback-режиме.
paragraph_min_length = 20
