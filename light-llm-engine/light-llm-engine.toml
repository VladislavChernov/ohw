# light-llm-engine — конфигурация подключения к LLM.
#
# Приоритет слоёв (низший → высший):
#   значения по умолчанию < этот файл < переменные окружения OLLAMA_* < аргументы CLI
#
# Переменные окружения:
#   OLLAMA_BASE_URL  — адрес сервиса ollama (перекрывает [ollama] base_url)
#   OLLAMA_MODEL     — имя модели (перекрывает [ollama] model)

[ollama]
# Адрес сервиса локальной LLM.
# - локальный запуск движка: http://localhost:11434
# - внутри docker compose:   http://ollama:11434
base_url = "http://localhost:11434"

# Имя модели, установленной в ollama (например, qwen2.5:7b-instruct,
# llama3.2:3b, phi3:mini). Обязательный параметр.
model = "qwen2.5:7b-instruct"

# Таймаут HTTP-запроса к модели, секунды.
timeout = 180.0

# Опциональный системный промпт, отправляемый модели вместе с запросом.
# system = "Ты — консультант. Отвечай кратко и по делу."

[paths]
# Папка с файлами запросов (в контейнере — /data/input).
input_dir = "input"
# Папка для ответов модели (в контейнере — /data/output).
output_dir = "output"

[generation]
# Температура сэмплирования [0.0, 2.0].
temperature = 0.7
# Дополнительные попытки запроса при пустом ответе модели.
max_retries = 3