name: dz5-stand

# Autonomous compose for the dz5 agent-security stand.
#
# This stack is intentionally self-contained (like Dz4): it does NOT use the
# shared ohw-ollama or ohw_net, because the abliterated model must stay
# isolated from the shared model volume used by other homeworks.
#
# Services are added incrementally as their bundles land:
#   - ollama  (abliterated GPU target)    add-abliterated-llm  ✅
#   - db      (SQLite + seed/restore)    add-db-service       ✅
#   - agent   (drujensen @ pinned tag)   add-agent-core
#   - wall    (Guardrails AI proxy)      add-external-defense
#   - attacker(garak + runner)           add-attack-harness
#
# Two protection presets are toggled by env (see project.md):
#   BUILTIN_GUARDS, EXTERNAL_GUARD. L3 (resource limits) is always on.

services:
  # Abliterated local LLM (GPU target). Safety alignment stripped on purpose so
  # the baseline preset can honestly show vulnerabilities.
  ollama:
    build:
      context: ./ollama
      dockerfile: Dockerfile
    image: dz5-ollama-target:local
    container_name: ollama_target
    environment:
      OLLAMA_MODEL: ${OLLAMA_MODEL:-huihui_ai/llama3.2-abliterate:3b}
    volumes:
      - ollama_data:/root/.ollama
    ports:
      # Published only for local debugging; services reach it as ollama:11434.
      - "11434:11434"
    # L3 (Unbounded Consumption / LLM06): cap memory so a runaway generation
    # or resource-exhaustion attack cannot take down the host.
    # GPU access (verified locally on Docker Desktop + NVIDIA, ollama 0.40.4).
    deploy:
      resources:
        limits:
          memory: 4000M
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck:
      test: ["CMD-SHELL", "ollama show \"$$OLLAMA_MODEL\" >/dev/null 2>&1"]
      interval: 10s
      timeout: 3s
      retries: 60
      start_period: 20s
    networks:
      - ib-network

  # SQLite file DB. Not a server: data lives in the db_data volume and is
  # seeded/restored on demand and read by the agent's db_query tool.
  db:
    build:
      context: ./db
      dockerfile: Dockerfile
    image: dz5-db:local
    container_name: dz5-db
    environment:
      DB_PATH: /data/db.sqlite
    volumes:
      - db_data:/data
      - ./db:/db:ro
    networks:
      - ib-network
    # No long-running process; used via `docker compose run --rm db <script>`.

  # One-shot: build schema + seed synthetic users + PII.
  db-seed:
    build:
      context: ./db
      dockerfile: Dockerfile
    image: dz5-db:local
    environment:
      DB_PATH: /data/db.sqlite
    volumes:
      - db_data:/data
      - ./db:/db:ro
    entrypoint: ["/bin/sh", "/db/seed.sh"]
    networks:
      - ib-network
    profiles: ["tools"]

  # One-shot: restore DB to seed state after a destructive tool-abuse run.
  db-restore:
    build:
      context: ./db
      dockerfile: Dockerfile
    image: dz5-db:local
    environment:
      DB_PATH: /data/db.sqlite
    volumes:
      - db_data:/data
      - ./db:/db:ro
    entrypoint: ["/bin/sh", "/db/restore.sh"]
    networks:
      - ib-network
    profiles: ["tools"]

  # One-shot: run an arbitrary read query for manual inspection / smoke.
  # Usage: docker compose run --rm db-query "SELECT username, role FROM users;"
  # The SQL is passed as the command argument; query.sh receives it as $1.
  db-query:
    build:
      context: ./db
      dockerfile: Dockerfile
    image: dz5-db:local
    environment:
      DB_PATH: /data/db.sqlite
    volumes:
      - db_data:/data
      - ./db:/db:ro
    entrypoint: ["/bin/sh", "/db/query.sh"]
    networks:
      - ib-network
    profiles: ["tools"]

  # Stand Go agent (preset 1 / Baseline). Reads the SQLite DB through db_query,
  # talks to the local abliterated LLM target. Protection presets switch via
  # BUILTIN_GUARDS (prompt) and EXTERNAL_GUARD (direct vs wall, milestone 4);
  # ALLOW_WRITES=1 opens the LLM03 tool-abuse demo (state via db-restore).
  agent:
    build:
      context: ../agent
      dockerfile: Dockerfile
    image: dz5-agent:local
    container_name: dz5-agent
    ports:
      - "8080:8080"
    environment:
      AGENT_ADDR: ":8080"
      OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-huihui_ai/llama3.2-abliterate:3b}
      DB_PATH: /data/db.sqlite
      BUILTIN_GUARDS: ${BUILTIN_GUARDS:-off}
      EXTERNAL_GUARD: ${EXTERNAL_GUARD:-off}
      ALLOW_WRITES: ${ALLOW_WRITES:-off}
    volumes:
      - db_data:/data:ro
    depends_on:
      ollama:
        condition: service_healthy
    # L3 (Unbounded Consumption / LLM06): cap memory so a runaway generation
    # or resource-exhaustion attack cannot take down the host.
    deploy:
      resources:
        limits:
          memory: 512M
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8080/healthz || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 60s
    networks:
      - ib-network

  # External LLM guard proxy (FastAPI + Guardrails AI) between agent and Ollama.
  # Receives Ollama-compatible POST /api/chat, validates input/output, blocks on
  # violation. Agent reaches it via EXTERNAL_GUARD=on + WALL_BASE_URL.
  wall:
    build:
      context: ../security-wall
      dockerfile: Dockerfile
    image: dz5-security-wall:local
    container_name: dz5-wall
    ports:
      # Published for local debugging; services reach it as wall:5000.
      - "5000:5000"
    environment:
      OLLAMA_BASE_URL: http://ollama:11434
      SCAN_INPUT: "on"
      SCAN_OUTPUT: "on"
      BLOCK_ON_FAIL: "on"
    depends_on:
      ollama:
        condition: service_healthy
    # L3 (Unbounded Consumption / LLM06): cap memory.
    deploy:
      resources:
        limits:
          memory: 1024M
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:5000/healthz || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 30s
    networks:
      - ib-network

networks:
  ib-network:
    driver: bridge

volumes:
  ollama_data:
  db_data:
