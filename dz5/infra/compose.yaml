name: dz5-stand

# Autonomous compose for the dz5 agent-security stand.
#
# This stack is intentionally self-contained (like Dz4): it does NOT use the
# shared ohw-ollama or ohw_net, because the abliterated model must stay
# isolated from the shared model volume used by other homeworks.
#
# Services are added incrementally as their bundles land:
#   - ollama  (abliterated LLM target)    add-abliterated-llm  ✅
#   - db      (SQLite + seed/restore)    add-db-service       ✅
#   - agent   (Go stand agent)           add-agent-core
#   - agent-fixed (preset 5)             add-fixed-agent
#   - ui      (agent registry/proxy)     add-agent-registry-ui
#   - wall    (Guardrails Server)        add-external-defense
#   - attacker(augustus + runner)        add-attack-harness
#
# Protection presets 1-4 are toggled by env (see project.md):
#   BUILTIN_GUARDS, EXTERNAL_GUARD. L3 (resource limits) is always on.

services:
  # Abliterated local LLM target. Safety alignment stripped on purpose so
  # the baseline preset can honestly show vulnerabilities.
  ollama:
    build:
      context: ./ollama
      dockerfile: Dockerfile
    image: dz5-ollama-target:local
    container_name: ollama_target
    environment:
      OLLAMA_MODEL: ${OLLAMA_MODEL:-huihui_ai/llama3.2-abliterate:3b}
      OLLAMA_MODEL_DIGEST: ${OLLAMA_MODEL_DIGEST:-sha256:2ffe056672b5e8028209eaf3a86c256ea6bf690dda5414335913418ed4f6183b}
    volumes:
      - ollama_data:/root/.ollama
    ports:
      # Published only for local debugging; services reach it as ollama:11434.
      - "11434:11434"
    # L3 (Unbounded Consumption / LLM06): cap memory so a runaway generation
    # or resource-exhaustion attack cannot take down the host.
    # GPU access is opt-in via compose.gpu.yaml; without that overlay Ollama
    # runs on the CPU.
    deploy:
      resources:
        limits:
          memory: 4000M
    healthcheck:
      test: ["CMD-SHELL", "ollama show \"$$OLLAMA_MODEL\" >/dev/null 2>&1"]
      interval: 10s
      timeout: 3s
      retries: 60
      start_period: 20s
    networks:
      - ib-network

  # SQLite file DB. Not a server: data lives in the db_data volume and is
  # seeded/restored on demand and read by the agent's db_query tool.
  db:
    build:
      context: ./db
      dockerfile: Dockerfile
    image: dz5-db:local
    container_name: dz5-db
    environment:
      DB_PATH: /data/db.sqlite
    volumes:
      - db_data:/data
      - ./db:/db:ro
    networks:
      - ib-network
    # No long-running process; used via `docker compose run --rm db <script>`.

  # One-shot: build schema + seed synthetic users + PII.
  db-seed:
    build:
      context: ./db
      dockerfile: Dockerfile
    image: dz5-db:local
    environment:
      DB_PATH: /data/db.sqlite
    volumes:
      - db_data:/data
      - ./db:/db:ro
    entrypoint: ["/bin/sh", "/db/seed.sh"]
    networks:
      - ib-network
    profiles: ["tools"]

  # One-shot: restore DB to seed state after a destructive tool-abuse run.
  db-restore:
    build:
      context: ./db
      dockerfile: Dockerfile
    image: dz5-db:local
    environment:
      DB_PATH: /data/db.sqlite
    volumes:
      - db_data:/data
      - ./db:/db:ro
    entrypoint: ["/bin/sh", "/db/restore.sh"]
    networks:
      - ib-network
    profiles: ["tools"]

  # Internal-only HTTP endpoint used by the UI "Restore DB" button. It has
  # write access to the db_data volume; never publish this port to the host.
  db-admin:
    build:
      context: ./db
      dockerfile: Dockerfile
    image: dz5-db:local
    container_name: dz5-db-admin
    environment:
      DB_PATH: /data/db.sqlite
    volumes:
      - db_data:/data
      - ./db:/db:ro
    entrypoint: ["/bin/sh", "/db/admin.sh"]
    networks:
      - ib-network
    deploy:
      resources:
        limits:
          memory: 64M
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8091/healthz || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 5s

  # One-shot: run an arbitrary read query for manual inspection / smoke.
  # Usage: docker compose run --rm db-query "SELECT username, role FROM users;"
  # The SQL is passed as the command argument; query.sh receives it as $1.
  db-query:
    build:
      context: ./db
      dockerfile: Dockerfile
    image: dz5-db:local
    environment:
      DB_PATH: /data/db.sqlite
    volumes:
      - db_data:/data
      - ./db:/db:ro
    entrypoint: ["/bin/sh", "/db/query.sh"]
    networks:
      - ib-network
    profiles: ["tools"]

  # Stand Go agent (presets 1-4). Reads the SQLite DB through db_query, talks
  # to the local abliterated LLM target. Protection presets switch via
  # BUILTIN_GUARDS (prompt) and EXTERNAL_GUARD (Guardrails Server validation);
  # ALLOW_WRITES=1 opens the LLM03 tool-abuse demo (state via db-restore).
  agent:
    build:
      context: ../agent
      dockerfile: Dockerfile
    image: dz5-agent:local
    container_name: dz5-agent
    ports:
      - "8080:8080"
    environment:
      AGENT_ADDR: ":8080"
      PROMPTS_DIR: /app/prompts
      OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-huihui_ai/llama3.2-abliterate:3b}
      DB_PATH: /data/db.sqlite
      BUILTIN_GUARDS: ${BUILTIN_GUARDS:-off}
      EXTERNAL_GUARD: ${EXTERNAL_GUARD:-off}
      ALLOW_WRITES: ${ALLOW_WRITES:-off}
      GUARDRAILS_BASE_URL: http://wall:8000
      INPUT_GUARD_NAME: input-defense
      WRITE_GUARD_NAME: write-defense
      OUTPUT_GUARD_NAME: output-privacy
      GUARDRAILS_TIMEOUT: 60s
      BLOCK_ON_FAIL: ${BLOCK_ON_FAIL:-on}
      ALLOW_RUNTIME_TOGGLES: ${ALLOW_RUNTIME_TOGGLES:-on}
      AUDIT_LOG: /audit/audit.jsonl
    volumes:
      - db_data:/data:ro
      - audit_data:/audit
    depends_on:
      ollama:
        condition: service_healthy
    # L3 (Unbounded Consumption / LLM06): cap memory so a runaway generation
    # or resource-exhaustion attack cannot take down the host.
    deploy:
      resources:
        limits:
          memory: 512M
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8080/healthz || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 60s
    networks:
      - ib-network

  # Stand Fixed Agent (preset 5): separate protected build with built-in guards,
  # prompt isolation, input/output validation, tool whitelist. Defaults to
  # BUILTIN_GUARDS=on, EXTERNAL_GUARD=off, ALLOW_WRITES=off.
  agent-fixed:
    build:
      context: ../agent
      dockerfile: Dockerfile
      args:
        TARGET_PKG: ./fixed
    image: dz5-agent-fixed:local
    container_name: dz5-agent-fixed
    ports:
      - "8081:8080"
    environment:
      AGENT_ADDR: ":8080"
      PROMPTS_DIR: /app/fixed-prompts
      OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-huihui_ai/llama3.2-abliterate:3b}
      DB_PATH: /data/db.sqlite
    volumes:
      - db_data:/data:ro
    depends_on:
      ollama:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 512M
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8080/healthz || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 60s
    networks:
      - ib-network

  # Agent registry + reverse proxy. The browser only talks to this service.
  ui:
    build:
      context: ../ui
      dockerfile: Dockerfile
    image: dz5-ui:local
    container_name: dz5-ui
    ports:
      - "8090:8090"
    environment:
      UI_ADDR: ":8090"
      AGENT_REGISTRY: "baseline=http://agent:8080,fixed=http://agent-fixed:8080"
      REPORTS_DIR: /reports
      DB_ADMIN_URL: http://db-admin:8091
    volumes:
      - ../reports:/reports:ro
    depends_on:
      agent:
        condition: service_started
      agent-fixed:
        condition: service_started
      db-admin:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 128M
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8090/healthz || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 20s
    networks:
      - ib-network

  # External LLM guard service (Guardrails Server) between agent and Ollama.
  # The agent validates prompts/replies via /guards/{id}/validate; it never
  # proxies LLM traffic through the wall and does not depend on wall uptime for
  # its own liveness (fail-closed on /chat when EXTERNAL_GUARD=on).
  # One-shot OWASP LLM attack runner. It writes reports/<run-id>/ and can
  # restore the SQLite volume before/after destructive scenarios.
  attack-runner:
    build:
      context: ..
      dockerfile: attack-runner/Dockerfile
    image: dz5-attack-runner:local
    container_name: dz5-attack-runner
    environment:
      TARGET: ${TARGET:-http://agent:8080}
      PRESET: ${PRESET:-1}
      RUNS: ${RUNS:-3}
      AUGUSTUS: ${AUGUSTUS:-off}
      AUGUSTUS_PROBES: ${AUGUSTUS_PROBES:-dan.DAN_Jailbreak,latentinjection.LatentJailbreak,goodside.SystemPromptConfusion}
      GIT_COMMIT: ${GIT_COMMIT:-unknown}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-huihui_ai/llama3.2-abliterate:3b}
      OLLAMA_MODEL_DIGEST: ${OLLAMA_MODEL_DIGEST:-sha256:2ffe056672b5e8028209eaf3a86c256ea6bf690dda5414335913418ed4f6183b}
      ALLOW_WRITES: ${ALLOW_WRITES:-off}
      BUILTIN_GUARDS: ${BUILTIN_GUARDS:-off}
      EXTERNAL_GUARD: ${EXTERNAL_GUARD:-off}
      BLOCK_ON_FAIL: ${BLOCK_ON_FAIL:-on}
      ALLOW_RUNTIME_TOGGLES: ${ALLOW_RUNTIME_TOGGLES:-on}
      DB_PATH: /data/db.sqlite
      DB_SCRIPTS_DIR: /db
      REPORTS_DIR: /reports
      TIMEOUT: ${TIMEOUT:-60}
    volumes:
      - ../reports:/reports
      - db_data:/data
      - ./db:/db:ro
    depends_on:
      agent:
        condition: service_healthy
      agent-fixed:
        condition: service_healthy
      wall:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 256M
    restart: "no"
    profiles: ["attack"]
    networks:
      - ib-network
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        exec python -m attack_runner run
        --target "$${TARGET}"
        --preset "$${PRESET}"
        --runs "$${RUNS}"
        --augustus "$${AUGUSTUS}"

  wall:
    build:
      context: ../security-wall
      dockerfile: Dockerfile
    image: dz5-security-wall:local
    container_name: dz5-wall
    ports:
      # Published for local debugging; services reach it as wall:8000.
      - "8000:8000"
    environment:
      GR_CONFIG_FILE_PATH: /app/config.py
      SELF_ENDPOINT: http://wall:8000
      GUARDRAILS_LOG_LEVEL: INFO
    # L3 (Unbounded Consumption / LLM06): cap memory. Presidio/spaCy with a
    # shared AnalyzerEngine/Anonymizer uses ~0.9-1.3 GiB RSS; 2048M keeps
    # headroom. Without the shared engine DetectPII leaked ~300 MiB per call.
    deploy:
      resources:
        limits:
          memory: 2048M
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health-check', timeout=3)\""]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 60s
    networks:
      - ib-network

networks:
  ib-network:
    driver: bridge

volumes:
  ollama_data:
  db_data:
  audit_data:
