name: ohw-infra

# Component catalog. One shared service per component, each enabled by its own
# compose profile (the profile name == component name). Projects declare which
# components they need in their <project>/infra.yaml; `up.ps1` reads that file
# and starts exactly the declared profiles.
#
#   .\up.ps1 -Project D:\Otus\Dz2     # start components declared by Dz2
#   .\up.ps1 -Project D:\Otus\Dz3\simple
#   .\down.ps1                        # stop all shared components
#   .\ps.ps1                          # status
#
# Contracts (how a project reaches a component):
#   - host process (uv run ...):         http://localhost:<port>
#   - project devcontainer:              http://host.docker.internal:<port>
#   - project compose on shared network: http://<service-name>:<port>
# The network `ohw_net` below is created once (external for projects) so app
# services can join it and talk to any component by its container name.

services:
  ollama:
    profiles: ["ollama"]
    # Pinned deliberately (was :latest) so every machine runs the same engine.
    # Bump consciously: update tag, then re-run E2E.
    image: ollama/ollama:0.33.3
    container_name: ohw-ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    environment:
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5:7b-instruct}
    volumes:
      - ollama_models:/root/.ollama
    entrypoint:
      - /bin/sh
      - -c
      - |
        ollama serve &
        server=$$!
        until ollama ls >/dev/null 2>&1; do sleep 1; done
        if ollama ls | awk '{print $$1}' | grep -Fxq "$$OLLAMA_MODEL"; then
          echo "model ready: $$OLLAMA_MODEL"
        else
          echo "pulling '$$OLLAMA_MODEL' (one-time download)..."
          until ollama pull "$$OLLAMA_MODEL"; do
            echo "pull failed, retrying in 5s..."
            sleep 5
          done
        fi
        wait $$server
    healthcheck:
      test: ["CMD-SHELL", "ollama show \"$$OLLAMA_MODEL\" >/dev/null 2>&1"]
      interval: 5s
      timeout: 3s
      retries: 60
      start_period: 15s
    networks:
      - ohw_net

networks:
  ohw_net:
    name: ohw_net

volumes:
  ollama_models:
    name: ohw_ollama_models