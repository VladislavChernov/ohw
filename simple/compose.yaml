# Project compose: only the app. Shared components (ollama) come from the
# infra catalog. Start them first:
#   .\infra\up.ps1 -Project D:\Otus\Dz3\simple
# or:  docker compose -f ../infra/compose.yaml --profile ollama up -d
# The app joins the shared network `ohw_net` and reaches ollama as `ohw-ollama`.

services:
  app:
    build: .
    restart: "no"
    environment:
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://ohw-ollama:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5:7b-instruct}
    volumes:
      - ./output:/data/output
    networks:
      - ohw-net

networks:
  ohw-net:
    external: true
    name: ohw_net