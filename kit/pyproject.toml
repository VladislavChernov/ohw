[project]
name = "ohw-kit"
version = "0.1.0"
description = "Shared building blocks for the ohw homework projects (Ollama client, extensible input reading, Markdown rendering)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28",
]

[dependency-groups]
dev = [
    "mypy>=1.14",
    "pytest>=8.3",
    "pytest-mock>=3.14",
    "ruff>=0.9",
]

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "ohw_kit"

[tool.ruff.lint]
# Files checked out on Windows carry the executable bit when mounted into
# Linux containers (devcontainer), which false-positives EXE002
# ("executable but no shebang").
ignore = ["EXE002"]