[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[project]
name = "api-testgen"
version = "0.1.0"
description = "Generate API autotests via local ollama LLM (pytest + requests)"
readme = "README.md"
authors = [
    { name = "Vlad", email = "vladislav.chernov@ligastavok.ru" }
]
requires-python = ">=3.13"
dependencies = [
    "httpx>=0.28",
    "pyyaml>=6.0",
    "pytest>=8.3",
    "requests>=2.34.2",
]

[project.scripts]
api-testgen = "api_testgen.cli:main"

[dependency-groups]
dev = [
    "mypy>=1.14",
    "pytest>=8.3",
    "pytest-mock>=3.14",
    "ruff>=0.9",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.mypy]
python_version = "3.13"
strict = true
