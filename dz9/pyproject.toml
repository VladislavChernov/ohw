[project]
name = "model-quality-lab"
version = "0.1.0"
description = "Model quality lab: dataset loading, training, metrics and visualization (Dz9)"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "matplotlib>=3.8.0",
    "scikit-learn>=1.3.0",
]

[dependency-groups]
dev = [
    "mypy>=1.9.0",
    "pytest>=8.0.0",
    "ruff>=0.3.0",
]

[build-system]
requires = ["uv_build>=0.8.0,<0.9.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "model_quality_lab"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "unit: unit tests without network or external data",
]

[tool.ruff]
target-version = "py313"

[tool.mypy]
python_version = "3.13"
