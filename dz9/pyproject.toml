[project]
name = "model-quality-lab"
version = "0.1.0"
description = "Model quality lab: dataset loading, training, metrics and visualization (Dz9)"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "matplotlib==3.11.2",
    "numpy==2.5.4",
    "scikit-learn==1.9.1",
]

[dependency-groups]
dev = [
    "mypy==2.4.1",
    "pytest==9.2.0",
    "ruff==0.17.3",
]

[build-system]
requires = ["uv_build>=0.8.0,<0.9.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "model_quality_lab"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "unit: unit tests without network or external data",
]

[tool.ruff]
target-version = "py313"

[tool.ruff.lint]
ignore = ["EXE002"]

[tool.ruff.lint.isort]
known-first-party = ["model_quality_lab"]

[tool.mypy]
python_version = "3.13"
ignore_missing_imports = true
