[project]
name = "graduation-project"
version = "0.1.0"
description = "Graduation project: automated test documentation generation with a local LLM"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Vladislav Chernov" },
]

dependencies = [
    "httpx>=0.28",
    "pydantic>=2.11",
    "matplotlib>=3.9",
    "streamlit>=1.40",
]

[dependency-groups]
dev = [
    "mypy>=1.14",
    "pytest>=8.3",
    "pytest-mock>=3.14",
    "ruff>=0.9",
]

[tool.uv]
# The project is executed from its own folder (`python -m src.workflow.main`),
# it does not have to be installed as a wheel.
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
markers = [
    "integration: requires a live Ollama service",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
check_untyped_defs = true
