# Override для minimal-стенда: отдельный проект и маленькая instruct-модель.
#
# Запуск (второй файл обязателен, иначе поднимется старый стенд):
#   docker compose -f compose.eval-minimal.yaml -f compose.eval-qwen3b.yaml up -d
#
# Старый стенд `ohw-eval-minimal` не трогается: новое `name` даёт всем томам префикс
# `ohw-eval-qwen3b_*`, поэтому `models_data:` ниже сам разрешается в
# `ohw-eval-qwen3b_models_data`, и общий том со старым стендом не переиспользуется.
#
# Почему не копия compose-файла: копия в 230 строк разъедется с оригиналом при первой же
# правке. Здесь только то, что отличается.

name: ohw-eval-qwen3b

services:
  llm:
    # В minimal-стенде тома `/models` у llm НЕТ: модель запекается в образ
    # (объявленный `models_data` монтируется только в embeddings-service). Поэтому
    # без этой строки llama-server ищет файл в образе и падает с «No such file or
    # directory», даже когда файл скачан. Том подставляется из нового имени проекта.
    volumes:
      - models_data:/models
    # Qwen2.5-3B-Instruct Q4_K_M, 2007 МиБ. Модель та же, что стояла по контракту ADR-002
    # как конфигурация стенда, но меньше: на карте с 8 ГБ полный вынос 7B не оставлял запаса,
    # а для проверки предиката уборки качество извлечения не требуется — требуется лишь
    # валидный JSON и хотя бы одна связь.
    command:
      - "--model"
      - "/models/qwen2.5-3b-instruct-q4_k_m.gguf"
      - "--host"
      - "0.0.0.0"
      - "--port"
      - "8080"
      - "--ctx-size"
      - "${LLM_CTX_SIZE:-16384}"
      - "--n-gpu-layers"
      - "${LLM_NGPU_LAYERS:-99}"

  eval-runner:
    environment:
      # Имя модели в запросе OpenAI-совместимому эндпоинту. Проверено пробой: сервер
      # принимает и полный путь, и короткое имя, поэтому здесь короткое.
      LLM_MODEL: qwen2.5-3b-instruct-q4_k_m

  ingestion-api:
    environment:
      # Окно модели тем же именем, каким она поднимается в llm: сборка адаптера сверяет
      # с ним max_tokens, и два числа из разных мест разъехаться не могут.
      LLM_CTX_SIZE: "${LLM_CTX_SIZE:-16384}"
      # Бюджет ответа извлечения поднят с 4096 до 8192 (решение владельца 2026-09-30).
      # На 4096 JSON извлечения не закрывался: стенд отдавал `finish_reason='length'` и
      # `enrichment_degraded`, то есть извлечение молча уходило в детерминированный путь и
      # теряло сущности. При окне 16384 и промпте в несколько тысяч токенов 8192 оставляет
      # место под ответ; выше поднимать смысла нет, пока не сокращён сам запрос к модели.
      LLM_MAX_TOKENS: "${LLM_MAX_TOKENS:-8192}"
      # Журнал обмена с моделью на диагностическом стенде включён по умолчанию
      # (`docs/llm_exchange_log.md`). Уровень `response` НЕ пишет текст документа: ответ
      # модели даёт, промпт с текстом чанка - нет. Файл лежит в томе `ingestion_data`,
      # поэтому переживает перезапуск контейнера и читается с хоста. `MAX_CHARS=0` - не
      # усекать: стенд диагностический, а обрезанный ответ в разборе бесполезен.
      # Выключается одним значением: `LLM_EXCHANGE_LOG=off`.
      LLM_EXCHANGE_LOG: "${LLM_EXCHANGE_LOG:-response}"
      LLM_EXCHANGE_LOG_FILE: "/data/llm-exchange.jsonl"
      LLM_EXCHANGE_LOG_MAX_CHARS: "${LLM_EXCHANGE_LOG_MAX_CHARS:-0}"
      # Обязательно здесь, а не только у раннера: `ingestion-api` строит LLM-адаптер сам,
      # и minimal-стенд задаёт ему 7B-имя по умолчанию. Ошибка была бы молчаливой -
      # llama.cpp-сервер принимает в поле `model` любое значение и отдаёт загруженную
      # модель, поэтому стенд с 3B запросил бы 7B-имя и получил бы ответ 3B, ничего не
      # сообщив. Это проверяется в контейнере: build_llm()._model.
      LLM_MODEL: qwen2.5-3b-instruct-q4_k_m

  embeddings-service:
    # В minimal-стенде эмбеддинги были принудительно на CPU, и это было сознательное
    # решение, а не забытый костыль: GPU целиком отдавался 7B-модели
    # (`compose.eval.yaml` это комментирует: "bge-m3 на CPU; LLM конфигурируется
    # отдельно"). Основной `compose.yaml` наоборот даёт эмбеддингам CUDA.
    # С 3B-моделью (~2.7 ГБ) bge-m3 (~1.5 ГБ) помещается на карте рядом с ней, и стенд
    # возвращается к профилю из `docs/06` §3. Обе правки обязательны вместе: без
    # резервирования устройства `model.py` не увидит CUDA и молча уйдёт на CPU.
    environment:
      EMBEDDINGS_DEVICE: cuda
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
