# GraphRAG Prototype — Docker Compose skeleton
# Источник: docs/infrastructure_stack.md §2, docs/04 §1, docs/05_adr_log.md ADR-019,
#           docs/history.md Этап 7 §8.2 (профили), README §3, §5 (запуск, JVM).
#
# Статус: каркас для вехи M0. Имена образов (build/image) уточняются при реализации;
#         все сервисы уже распределены по профилям и портам согласно документации.
name: ohw

x-gpu: &gpu
  deploy:
    resources:
      reservations:
        devices:
          - driver: nvidia
            count: 1
            capabilities: [gpu]

x-logging: &logging
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  # ------------------------------------------------------------------ config
  # Работает ВСЕГДА. Config Service + Glossary Service.
  config-service:
    build:
      context: ..
      dockerfile: Dockerfile
    image: ohw/config-service:prototype
    profiles: ["config"]
    container_name: ohw-config
    networks: [ohw_net]
    ports: ["8001:8001"]
    environment:
      CONFIG_DB_PATH: /data/config.sqlite
      DOMAIN_PROFILES_DIR: /profiles
      NAMESPACES_PATH: /config/namespaces.yaml
      AUTH_API_KEY: ${GRAPH_AUTH_API_KEY:-changeme}
    volumes:
      - config_data:/data
      - ../domain_profiles:/profiles:ro
      - ./config:/config:ro
    healthcheck:
      test:
        - "CMD"
        - "sh"
        - "-lc"
        - "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8001/health', timeout=2)\""
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    <<: *logging

  glossary-service:
    build:
      context: ..
      dockerfile: Dockerfile
    image: ohw/glossary-service:prototype
    command: ["graphrag-glossary"]
    profiles: ["config"]
    container_name: ohw-glossary
    depends_on:
      - config-service
    networks: [ohw_net]
    ports: ["8003:8003"]
    environment:
      DOMAIN_PROFILES_DIR: /glossaries
      CONFIG_URL: http://config-service:8001
      AUTH_API_KEY: ${GRAPH_AUTH_API_KEY:-changeme}
    volumes:
      - ../domain_profiles:/glossaries:ro
    healthcheck:
      test:
        - "CMD"
        - "sh"
        - "-lc"
        - "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8003/health', timeout=2)\""
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    <<: *logging

  # ------------------------------------------------------------------- graph
  # Neo4j Community. Работает ВСЕГДА. JVM ограничена (риск №2, v7 §8.4).
  neo4j:
    image: neo4j:5.26-community
    profiles: ["graph"]
    container_name: ohw-neo4j
    networks: [ohw_net]
    ports:
      - "7474:7474"   # HTTP (Web UI Neo4j)
      - "7687:7687"   # Bolt
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-graphrag}
      NEO4J_server_memory_heap_max__size: "1G"
      NEO4J_server_memory_pagecache_size: "512M"
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ["CMD", "cypher-shell", "-u", "neo4j", "-p", "${NEO4J_PASSWORD:-graphrag}", "RETURN 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    <<: *logging

  # --------------------------------------------------------------- topology
  # ADR-019: отдельный сервис фабрики провайдеров + отдельный Topology UI.
  topology-orchestrator:
    build:
      context: ..
      dockerfile: Dockerfile
    image: ohw/topology-orchestrator:prototype
    command: ["graphrag-topology"]
    profiles: ["topology"]
    container_name: ohw-topology
    networks: [ohw_net]
    ports: ["8005:8005"]
    environment:
      INFRA_TOPOLOGY_PATH: /topology/infra_topology.yaml
      TOPOLOGY_DB_PATH: /data/topology.sqlite
      AUTH_API_KEY: ${GRAPH_AUTH_API_KEY:-changeme}
    volumes:
      - ../infra_topology.yaml:/topology/infra_topology.yaml:ro
      - topology_data:/data
    healthcheck:
      test:
        - "CMD"
        - "sh"
        - "-lc"
        - "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8005/health', timeout=2)\""
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    <<: *logging

  # topology-ui — отложен (ADR-019: Topology UI :8502, веха M3+; образ не собирается).
  # Блок закомментирован, чтобы профиль `topology` поднимался без несуществующего образа.
  # topology-ui:
  #   image: ohw/topology-ui:prototype
  #   profiles: ["topology"]
  #   container_name: ohw-topology-ui
  #   depends_on:
  #     - topology-orchestrator
  #   networks: [ohw_net]
  #   ports: ["8502:8502"]
  #   environment:
  #     TOPOLOGY_API_URL: http://topology-orchestrator:8005
  #     AUTH_API_KEY: ${GRAPH_AUTH_API_KEY:-changeme}
  #   <<: *logging

  # -------------------------------------------------------------- embeddings
  # bge-m3 на GPU (образа собирается из Dockerfile.embeddings).
  # Только на фазе индексации (L4-01 — поочерёдная работа).
  embeddings-service:
    image: ohw/embeddings-service:prototype
    build:
      context: ..
      dockerfile: Dockerfile.embeddings
    profiles: ["embeddings"]
    container_name: ohw-embeddings
    command: ["graphrag-embeddings"]
    networks: [ohw_net]
    ports: ["8004:8004"]
    environment:
      EMBEDDING_MODEL: bge-m3
      EMBEDDING_DIMENSIONS: 1024
      EMBEDDINGS_MOCK: ${EMBEDDINGS_MOCK:-false}
      EMBEDDINGS_DEVICE: ${EMBEDDINGS_DEVICE:-cuda}
      AUTH_API_KEY: ${GRAPH_AUTH_API_KEY:-changeme}
    volumes:
      - models_data:/models
    healthcheck:
      test:
        - "CMD"
        - "sh"
        - "-lc"
        - "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8004/health', timeout=2)\""
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    <<: [*gpu, *logging]

  # --------------------------------------------------------------- ingestion
  # Ingestion API + пайплайн (9 этапов). Поочерёдно забирает GPU.
  ingestion-api:
    image: ohw/ingestion-service:prototype
    command: ["graphrag-ingestion"]
    profiles: ["ingestion"]
    container_name: ohw-ingestion
    depends_on:
      - config-service
      - glossary-service
      - neo4j
    networks: [ohw_net]
    ports: ["8002:8002"]
    environment:
      CONFIG_URL: http://config-service:8001
      GLOSSARY_URL: http://glossary-service:8003
      GRAPH_STORE: neo4j
      VECTOR_STORE: neo4j
      EMBEDDER: deterministic
      RERANKER: noop
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-graphrag}
      INGEST_CHUNKER: ${INGEST_CHUNKER:-sliding_window}
      INGEST_CHUNK_SIZE: ${INGEST_CHUNK_SIZE:-512}
      INGEST_CHUNK_OVERLAP: ${INGEST_CHUNK_OVERLAP:-64}
      INGEST_MAX_CONCURRENT: ${INGEST_MAX_CONCURRENT:-2}
      AUTH_API_KEY: ${GRAPH_AUTH_API_KEY:-changeme}
    volumes:
      - ../domain_profiles:/profiles:ro
    healthcheck:
      test:
        - "CMD"
        - "sh"
        - "-lc"
        - "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8002/health', timeout=2)\""
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    <<: [*gpu, *logging]

  # --------------------------------------------------------------------- llm
  # Query API + Query Worker + valkey (Task Queue) + llama.cpp server.
  # Query API — асинхронный контур M2 (ADR-023): POST /query -> очереди -> SSE stream.
  valkey:
    image: valkey/valkey:9.1.2
    profiles: ["llm"]
    container_name: ohw-valkey
    networks: [ohw_net]
    ports: ["6379:6379"]
    command: ["valkey-server", "--appendonly", "no"]
    volumes:
      - valkey_data:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    <<: *logging

  query-api:
    build:
      context: ..
      dockerfile: Dockerfile
    image: ohw/query-api:prototype
    command: ["graphrag-query-api"]
    profiles: ["llm"]
    container_name: ohw-query
    depends_on:
      - config-service
      - neo4j
      - valkey
    networks: [ohw_net]
    ports: ["8000:8000"]
    environment:
      CONFIG_URL: http://config-service:8001
      DOMAIN_PROFILES_DIR: /profiles
      GRAPH_STORE: neo4j
      VECTOR_STORE: neo4j
      EMBEDDER: deterministic
      RERANKER: noop
      LLM_ADAPTER: openai
      LLM_BASE_URL: http://llm:8080
      QUERY_QUEUE: redis
      QUERY_REDIS_URL: redis://valkey:6379/0
      QUERY_TASK_DB_PATH: /data/query_tasks.sqlite
      AUTH_API_KEY: ${GRAPH_AUTH_API_KEY:-changeme}
    volumes:
      - ../domain_profiles:/profiles:ro
      - query_data:/data
    healthcheck:
      test:
        - "CMD"
        - "sh"
        - "-lc"
        - "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=2)\""
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    <<: *logging

  query-worker:
    build:
      context: ..
      dockerfile: Dockerfile
    image: ohw/query-worker:prototype
    command: ["graphrag-query-worker"]
    profiles: ["llm"]
    container_name: ohw-query-worker
    depends_on:
      - config-service
      - neo4j
      - llm
      - valkey
    networks: [ohw_net]
    environment:
      CONFIG_URL: http://config-service:8001
      DOMAIN_PROFILES_DIR: /profiles
      GRAPH_STORE: neo4j
      VECTOR_STORE: neo4j
      EMBEDDER: deterministic
      RERANKER: noop
      LLM_ADAPTER: openai
      LLM_BASE_URL: http://llm:8080
      QUERY_QUEUE: redis
      QUERY_REDIS_URL: redis://valkey:6379/0
      QUERY_TASK_DB_PATH: /data/query_tasks.sqlite
      RETRIEVAL_GRAPH_ENABLED: ${RETRIEVAL_GRAPH_ENABLED:-true}
      SEMANTIC_CACHE_ENABLED: ${SEMANTIC_CACHE_ENABLED:-}
      SEMANTIC_CACHE_MODE: ${SEMANTIC_CACHE_MODE:-redis}
      SEMANTIC_CACHE_THRESHOLD: ${SEMANTIC_CACHE_THRESHOLD:-0.85}
      SEMANTIC_CACHE_TTL_S: ${SEMANTIC_CACHE_TTL_S:-3600}
      TOPOLOGY_URL: ${TOPOLOGY_URL:-http://topology-orchestrator:8005}
      TOPOLOGY_POLL_INTERVAL: ${TOPOLOGY_POLL_INTERVAL:-5}
      AUTH_API_KEY: ${GRAPH_AUTH_API_KEY:-changeme}
    volumes:
      - ../domain_profiles:/profiles:ro
      - query_data:/data
    <<: *logging

  # --------------------------------------------------------------- demo-ui
  # Браузерный демо-контур (add-demo-ui-e2e): загрузка txt/md -> INGEST ->
  # запрос -> SSE-стрим ответа со sources. Streamlit на :8503.
  demo-ui:
    build:
      context: ..
      dockerfile: Dockerfile
    image: ohw/demo-ui:prototype
    command: ["graphrag-demo-ui"]
    profiles: ["llm"]
    container_name: ohw-demo-ui
    depends_on:
      - config-service
      - ingestion-api
      - query-api
    networks: [ohw_net]
    ports: ["8503:8503"]
    environment:
      INGESTION_URL: http://ingestion-api:8002
      QUERY_URL: http://query-api:8000
      CONFIG_URL: http://config-service:8001
      X_API_KEY: ${GRAPH_AUTH_API_KEY:-changeme}
    healthcheck:
      test:
        - "CMD"
        - "sh"
        - "-lc"
        - "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8503/_stcore/health', timeout=2)\""
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 15s
    <<: *logging

  # llama.cpp server (CUDA-сборка). Self-contained: модели вшиты в образ при сборке
  # (Dockerfile.llm скачивает GGUF с Hugging Face по pin-ревизии и проверяет SHA-256).
  # Рантайм не зависит от ФС хоста — локальный GGUF-файл не требуется.
  # Смена модели = build-arg'и HF_REPO/HF_REVISION/HF_FILE/HF_SHA256.
  llm:
    build:
      context: ..
      dockerfile: Dockerfile.llm
    image: ohw/llm:prototype
    profiles: ["llm"]
    container_name: ohw-llm
    networks: [ohw_net]
    ports: ["8080:8080"]
    command:
      - "--model"
      - "/models/Qwen2.5-Coder-7B-Instruct-abliterated-Q4_K_M.gguf"
      - "--host"
      - "0.0.0.0"
      - "--port"
      - "8080"
      - "--ctx-size"
      - "8192"
      - "--n-gpu-layers"
      - "99"
    healthcheck:
      # в образе llama.cpp нет `python` (есть `python3` и `curl`) — проба через curl
      test: ["CMD", "curl", "-sf", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    <<: [*gpu, *logging]

  # ---------------------------------------------------------------- reranker
  # bge-reranker-base на CPU (образ из Dockerfile.reranker).
  # Опционально (NoOp-адаптер допустим).
  reranker:
    image: ohw/reranker:prototype
    build:
      context: ..
      dockerfile: Dockerfile.reranker
    profiles: ["reranker"]
    container_name: ohw-reranker
    command: ["graphrag-reranker"]
    networks: [ohw_net]
    ports: ["8006:8006"]
    environment:
      RERANKER_MODEL: bge-reranker-base
      RERANKER_MOCK: ${RERANKER_MOCK:-false}
      AUTH_API_KEY: ${GRAPH_AUTH_API_KEY:-changeme}
    healthcheck:
      test:
        - "CMD"
        - "sh"
        - "-lc"
        - "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8006/health', timeout=2)\""
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    <<: *logging

  # ---------------------------------------------------------------- query-ui
  # Web UI — Конфигуратор «Бизнес-онтология» (фаза 2, веха M5; вне M0–M4).
  configurator-ui:
    image: ohw/configurator-ui:prototype
    profiles: ["configurator"]
    container_name: ohw-configurator-ui
    depends_on:
      - config-service
      - glossary-service
    networks: [ohw_net]
    ports: ["8501:8501"]
    environment:
      CONFIG_URL: http://config-service:8001
      GLOSSARY_URL: http://glossary-service:8003
      AUTH_API_KEY: ${GRAPH_AUTH_API_KEY:-changeme}
    <<: *logging

  # -------------------------------------------------------------- monitoring
  # ЗАДЕЛ (фаза 2), блок ОТКЛЮЧЁН и не запускается: конфигурация ./prometheus
  # отсутствует в репозитории, сервисы не экспортируют метрики Prometheus и не
  # шлют логи в Loki — старт профиля был бы невалиден. Включить вместе с
  # реализацией экспортов /metrics и добавлением infra/prometheus/prometheus.yml.
  # prometheus:
  #   image: prom/prometheus:v3.14.0
  #   profiles: ["monitoring"]
  #   container_name: ohw-prometheus
  #   networks: [ohw_net]
  #   ports: ["9090:9090"]
  #   volumes:
  #     - ./prometheus:/etc/prometheus:ro
  #   <<: *logging
  #
  # grafana:
  #   image: grafana/grafana:13.2.1
  #   profiles: ["monitoring"]
  #   container_name: ohw-grafana
  #   depends_on:
  #     - prometheus
  #   networks: [ohw_net]
  #   ports: ["3000:3000"]
  #   <<: *logging
  #
  # loki:
  #   image: grafana/loki:3.7.7
  #   profiles: ["monitoring"]
  #   container_name: ohw-loki
  #   networks: [ohw_net]
  #   ports: ["3100:3100"]
  #   <<: *logging

networks:
  ohw_net:
    driver: bridge

volumes:
  config_data:
  neo4j_data:
  models_data:
  valkey_data:
  query_data:
  topology_data:
  ollama_data:  # задел (модели Ollama); веса LLM — внутри образа ohw/llm (Dockerfile.llm)