# Оверлей demo-стенда на видеокарте NVIDIA. Подключается `demo.sh` и `demo.ps1`,
# которые подкладывают его безусловно; вариант на процессоре его не подкладывает.
#
#   docker compose -f compose.runtime.yaml -f compose.runtime-gpu.yaml up -d --wait
#
# Устройство выдаёт только сам compose, флагом в командной строке. Поэтому видеокарта
# включается ТОЛЬКО этим оверлеем: без него бронь устройства не объявлена, и модель
# целиком считает на процессоре - это не ошибка, а штатный режим.
#
# Бронь выдаётся ОДНОМУ сервису - `llm`. Раньше сюда попадал ещё и `embeddings-service`,
# и это было противоречие: `EMBEDDINGS_DEVICE` в runtime-стенде по умолчанию `cpu`, то
# есть модель считала на процессоре, а compose требовал под неё драйвер NVIDIA и держал
# видеопамять. Запрашивать устройство ради сервиса, который им не пользуется, - это
# требование без пользы: на машине без карты оно ломает подъём, на машине с картой занимает
# память впустую.
#
# Переключать эмбеддинги на `cuda` - отдельное решение владельца, и оно меняет точность
# векторов между CPU- и GPU-прогонами, поэтому здесь не делается.
#
# Тот же приём в общем слое репозитория: `infra/compose.yaml` без брони плюс
# `infra/compose.gpu.yaml`, который выбирает `infra/up.sh --gpu`.

services:
  llm:
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]