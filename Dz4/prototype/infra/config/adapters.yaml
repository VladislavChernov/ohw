# Runtime-конфигурация слоя адаптеров (namespace: adapters)
# Источник: docs/04 §3, §5.1; docs/history/v7/CONCEPT.md §2.5; docs/adapters_guide.md.
# Читается Config Service / Topology Orchestrator при старте; переключение на лету —
# через PUT /api/v1/config/adapters (L1-03, ADR-019).
#
# Значения по умолчанию = прототип. Доступные оси фиксированы:
# graph_store, vector_store, llm, embeddings, reranker.
# Допустимые id слота — каталог фабрики retrieval/adapters/factory.py::ADAPTER_CATALOG;
# контракт закрыт тестом test_adapter_catalog_ssot.py (значение YAML ∈ каталог слота).

adapters:
  graph_store: "neo4j"
  vector_store: "neo4j"
  llm: "openai"
  embeddings: "bge_m3_service"
  reranker: "bge_reranker"
  # A-2 (ADR-024): capability атомарности COMMIT по id адаптера. Значения:
  # "atomic" — ось может писать обе оси пары в одной транзакции движка при общем
  # engine_key(); "best_effort" — атомарность пары не обещается. Контракт закрыт
  # тестом test_adapter_catalog_ssot.py (декларация == consistency_capability()).

  capabilities:
    graph_store: "atomic"
    vector_store: "atomic"

# Параметры соединения для конкретных реализаций (namespace: storage).
storage:
  neo4j_uri: "bolt://neo4j:7687"
  neo4j_user: "neo4j"
  neo4j_password: "${NEO4J_PASSWORD:-graphrag}"
  # Заполняется при подключении дополнительных реализаций (docs/adapters_guide.md):
  # qdrant_url: "http://qdrant:6333"
  # qdrant_collection: "chunks"