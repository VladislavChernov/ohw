[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[project]
name = "graphrag-proto"
version = "0.1.0"
description = "GraphRAG prototype: Config/Glossary + Ingestion + Query (ДЗ4, M1–M2)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "pyyaml>=6.0",
    "pypdf>=5.0",
    "redis>=5.2",
    "neo4j>=5.26",
    "requests>=2.32",
    "streamlit>=1.40",
    # Кандидаты сущностей для стадии pre-ingest (ADR-053). НАТАША ОБЩАЯ, НЕ ЭКСКЛЮЗИВ
    # СТАДИИ: стоит в `[project.dependencies]`, поэтому `uv sync --no-dev` ставит её в
    # КАЖДЫЙ образ этого проекта вместе с моделью slovnet+navec (~37 МБ, измерено).
    # Раньше комментарий утверждал обратное - «natasha не нужен ingestion-пайплайну»,
    # и это было верно только пока образ ingestion-api был старше самой зависимости.
    #
    # Правило для того, кто хочет natasha в своём сервисе: зависимость уже есть, код
    # монтируется томом `../src:/app/src:ro`, и НИЧЕГО ДОПИСЫВАТЬ НЕ НУЖНО - нужно
    # пересобрать образ сервиса (`docker build` или `compose build`). Том монтирует
    # только `.py`; Python-пакеты живут в образе, поэтому без пересборки `import
    # natasha` упадёт `ModuleNotFoundError`, как это и было у образа
    # `ohw/ingestion-service:prototype`, собранного 2026-09-16, до 2026-10-05.
    #
    # Почему не extras: у extras своя карта зависимостей на каждый образ, и ошибка
    # «поставил без extras» повторяет ровно то, что описано выше. Плата ~37 МБ на образ
    # измерена и принята; решение о переносе в extras не принято.
    "natasha>=1.6",
]

[project.scripts]
graphrag-config = "graphrag_proto.config_service.app:main"
graphrag-glossary = "graphrag_proto.glossary_service.app:main"
graphrag-ingestion = "graphrag_proto.ingestion_service.app:main"
graphrag-projection = "graphrag_proto.ingestion_service.projection:main"
graphrag-query-api = "graphrag_proto.query_service.app:main"
graphrag-query-worker = "graphrag_proto.query_service.worker:main"
graphrag-demo-ui = "graphrag_proto.demo_ui.cli:main"
graphrag-topology = "graphrag_proto.topology_service.app:main"
graphrag-embeddings = "graphrag_proto.embeddings_service.app:main"
graphrag-reranker = "graphrag_proto.reranker_service.app:main"
graphrag-pre-ingest = "graphrag_proto.pre_ingest.generate:main"

[dependency-groups]
dev = [
    "httpx2>=0.1",
    "mypy>=1.14",
    "pytest>=8.3",
    "pytest-mock>=3.14",
    "ruff>=0.9",
    "types-PyYAML>=6.0",
    "types-requests>=2.32",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not e2e'"
markers = [
    "e2e: сквозной прогон против живого стека (запускать через infra/scripts/run_demo_e2e.sh)",
    "live: проверка против живого внешнего сервиса (Neo4j/Redis); по умолчанию пропускается",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
ignore = ["EXE002"]

[tool.mypy]
# 3.12 нужно, чтобы парсить стубы numpy 2.5 (PEP 695 `type`), притянутые streamlit.
python_version = "3.12"
strict = true
files = ["src"]

[[tool.mypy.overrides]]
module = ["streamlit", "streamlit.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["torch", "torch.*", "sentence_transformers", "sentence_transformers.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["langchain", "langchain.*", "langchain_text_splitters", "langchain_text_splitters.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["llama_index", "llama_index.*", "llama_index.core", "llama_index.core.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# Стадия pre-ingest (ADR-053). natasha не публикует заглушек типов, ровно как
# streamlit, torch и langchain выше; модуль используется в одной функции, где типы
# проверяются по факту, а не аннотацией.
module = ["natasha", "natasha.*"]
ignore_missing_imports = true