# Конфигурация сетевой топологии инсталляции (Topology Orchestrator)
# Источник: docs/05_adr_log.md (ADR-019), docs/00 (TOPO), docs/glossary.md,
#           docs/04 §1 (порты), docs/security.md §2 (роль operator).
#
# Читает Topology Orchestrator Service (:8005) и подменяет InMemory-классы
# на сетевые драйверы (Redis/RabbitMQ/vLLM) на лету (L1-03).
# Правки — оператор через Topology UI (:8502) или правка YAML.

version: 1
environment: ${GRAPH_ENV:-prototype}
network: ohw_net

# Пулы соединений и драйверы текущей инсталляции (активные провайдеры).
# Значения — id реализованных провайдеров каталога (retrieval/adapters/factory.py).
# Реализованы bge_m3_service (:8004) и bge_reranker (:8006) — см. docs/demo_runbook.md (M3.2).
# Снизу базовые значения deterministic/noop: запуск без GPU из коробки;
# переключение на bge — операторский шаг runbook (профили + правка providers).
providers:
  graph_store: neo4j
  vector_store: neo4j
  llm: openai
  embeddings: deterministic
  reranker: noop
  # Сетевые пулы (v6-контур): заполняются при включении Task Queue / в vLLM:
  queue_provider: none          # none | valkey_streams | rabbitmq
  # cache: "none"

# Консистентность COMMIT пары выводится из capability провайдеров (ADR-024, бандл
# architecture-atomic-commit): обе оси `consistency_capability()=="atomic"` и общий
# `engine_key()` — атомарная пара (граф+вектор в одной транзакции Neo4j на `endpoints.neo4j.bolt`).
# Разнородная пара (например neo4j + inmemory) автоматически становится best_effort
# с компенсацией. Стратегия определяется автоматически по паре — поля для оператора нет.

# Параметры соединений (перекрываются из namespace: storage).
endpoints:
  neo4j:
    bolt: "bolt://neo4j:7687"
    http: "http://neo4j:7474"
  ollama:
    base: "http://ollama:11434"
  embeddings:
    base: "http://embeddings-service:8004"
  valkey:
    base: "redis://valkey:6379"

# Runtime Redis/Valkey client settings. Query API/worker read this file through
# INFRA_TOPOLOGY_PATH; Topology Orchestrator exposes the same section via
# GET/PUT /api/v1/config/redis. Environment variables documented in docs/04
# override individual fields for a deployment.
redis:
  url: "redis://valkey:6379/0"
  socket_timeout_s: 2
  socket_connect_timeout_s: 2
  max_connections: 32
  retry_on_timeout: false
  health_check_interval_s: 30
  read_block_ms: 1000

# Offline projection lease. The Topology Configurator exposes this section via
# GET/PUT /api/v1/config/projection; the job renews the lease per source unit.
projection:
  lease_seconds: 300

# Настройки запуска инсталляции.
startup:
  auto_apply_adapters: true    # применять providers из этого файла при старте
  require_topology_apply: false # при false сервисы стартуют с InMemory-адаптерами