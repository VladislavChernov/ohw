# Domain Profile: library (пример расширения, документы docs/01 §1)
# Источник: docs/01 §2; docs/04 §4 (glossary.library.yaml — terms авторы,
#           genre_aliases, pen_names, unicode_map).
# Каркас: секции обязательны, содержимое наполняется при калибровке.

profile:
  name: "library"
  description: "Литература: авторы, произведения, жанры, экранизации"
  language: "ru"
  version: "1"

ontology:
  node_types:
    - type: "Author"
      unique_key: "canonical_name"
      # `gloss` и `emitted` добавлены вместе с генератором инструкции (2026-09-29):
      # пояснения и «что выдаёт модель» переехали из прозы промпта в данные, иначе
      # список типов в инструкции и в профиле разъезжаются без всякой ошибки.
      gloss: "человек, написавший книгу; псевдонимы склеиваются глоссарием"
      emitted: ["canonical_name"]
    - type: "Book"
      unique_key: "id"
      gloss: "произведение; перевод учитывается видом ADAPTED_INTO, а не тем же объектом"
      emitted: ["canonical_name", "name", "id"]
    - type: "Genre"
      unique_key: "canonical_name"
      gloss: "жанр или тематическая категория"
      emitted: ["canonical_name"]
  chunk_entity_edge: "MENTIONS"
  edge_types:
    - from: "Author"
      to: "Book"
      type: "WROTE"
    - from: "Book"
      to: "Genre"
      type: "BELONGS_TO"
    - from: "Book"
      to: "Book"
      type: "ADAPTED_INTO"

extraction:
  llm_enabled: false
  prompt_template:
    id: "extract_library_v1"
    system: "Извлеки сущности и связи по онтологии library (авторы, книги, жанры)."

validation:
  rules: []

canonicalization:
  nodes:
    Author:
      layers: ["unicode", "glossary", "trim_lower"]
    Book:
      layers: ["trim_lower"]
    Genre:
      layers: ["unicode", "glossary", "trim_lower"]

chunking:
  strategy: "sliding_window"
  chunk_size: 512
  overlap: 64

context_assembly:
  template:
    id: "context_library_v1"
    priorities: ["graph", "vector"]
  eviction: "drop_lowest_reranker_score"

retrieval:
  # L1/L2 query (GraphRetriever): MATCH по извлечённым терминам + один хоп рёбер.
  # {node_labels} подставляется из ontology.node_types в runtime (build_cypher);
  # подмножество Cypher — см. InMemoryGraphStore (ограниченная грамматика).
  # Тумблер графовой оси: false — только векторный поиск (env RETRIEVAL_GRAPH_ENABLED перекрывает).
  graph_search_enabled: true
  # Глубина обхода по умолчанию: середина допустимого диапазона 1..6 (решение владельца
  # 2026-09-29). Потолок живёт в MAX_EXPANSION_DEPTH, а не здесь; зажим объявляется в
  # трассировке (`depth_clamped`). Кодовый фолбэк (2) ниже намеренно меньше.
  max_depth: 3
  cypher_template: |
    MATCH (n) WHERE any(t IN $terms WHERE toLower(n.canonical_name) CONTAINS toLower(t) OR toLower(n.name) CONTAINS toLower(t) OR toLower(n.id) CONTAINS toLower(t))
    OPTIONAL MATCH (n)-[r]-(m) WHERE m:{node_labels}
    RETURN n, m, type(r) AS rel_type
    LIMIT $max_nodes
