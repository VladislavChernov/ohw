# Domain Profile: library (пример расширения, документы docs/01 §1)
# Источник: docs/01 §2; docs/04 §4 (glossary.library.yaml — terms авторы,
#           genre_aliases, pen_names, unicode_map).
# Каркас: секции обязательны, содержимое наполняется при калибровке.

profile:
  name: "library"
  description: "Литература: авторы, произведения, жанры, экранизации"
  language: "ru"
  version: "1"

ontology:
  node_types:
    - type: "Author"
      unique_key: "canonical_name"
    - type: "Book"
      unique_key: "id"
    - type: "Genre"
      unique_key: "canonical_name"
  edge_types:
    - from: "Author"
      to: "Book"
      type: "WROTE"
    - from: "Book"
      to: "Genre"
      type: "BELONGS_TO"
    - from: "Book"
      to: "Book"
      type: "ADAPTED_INTO"

extraction:
  prompt_template:
    id: "extract_library_v1"
    system: "Извлеки сущности и связи по онтологии library (авторы, книги, жанры)."
  temperature: 0.1
  max_tokens: 4096

validation:
  rules: []

canonicalization:
  nodes:
    Author:
      layers: ["unicode", "glossary", "trim_lower"]
    Book:
      layers: ["trim_lower"]
    Genre:
      layers: ["unicode", "glossary", "trim_lower"]

chunking:
  strategy: "sliding_window"
  chunk_size: 512
  overlap: 64

context_assembly:
  template:
    id: "context_library_v1"
    priorities: ["graph", "vector"]
  max_tokens: 4096
  eviction: "drop_lowest_reranker_score"

retrieval:
  # L1/L2 query (GraphRetriever): MATCH по извлечённым терминам + один хоп рёбер.
  # {node_labels} подставляется из ontology.node_types в runtime (build_cypher);
  # подмножество Cypher — см. InMemoryGraphStore (ограниченная грамматика).
  # Тумблер графовой оси: false — только векторный поиск (env RETRIEVAL_GRAPH_ENABLED перекрывает).
  graph_search_enabled: true
  cypher_template: |
    MATCH (n) WHERE any(t IN $terms WHERE toLower(n.canonical_name) CONTAINS toLower(t) OR toLower(n.name) CONTAINS toLower(t) OR toLower(n.id) CONTAINS toLower(t))
    OPTIONAL MATCH (n)-[r]-(m) WHERE m:{node_labels}
    RETURN n, m, type(r) AS rel_type
    LIMIT $max_nodes