# Domain Profile: it (базовый профиль, поставляется из коробки)
# Источник: docs/01 §2 (структура контракта ядра), §3 (генерация constraints),
#           docs/history.md Этап 7 §3 (архитектура доменов).
# Обязательные секции: profile, ontology, extraction, validation,
# canonicalization, chunking, context_assembly.

profile:
  name: "it"
  description: "ИТ-домен: требования, концепции, контракты (Requirement -> Concept -> Contract)"
  language: "ru"
  version: "1"
  # Канонические узлы/рёбра загружаются в Neo4j через COMMIT; constraints по
  # unique_key создаются идемпотентным GraphStoreProvider.ensure_schema перед первым
  # COMMIT домена (Config Service не имеет доступа к Neo4j).

ontology:
  # Вариант A (Стадия 7): идентичность доменных сущностей — canonical_name,
  # нормализуемый единой функцией `orchestrator._identity_key`
  # (NFKC + yo_fold + casefold + сжатие пробелов). `id` — необязательное
  # бизнес-свойство источника, ключом склейки узлов НЕ является.
  node_types:
    - type: "Requirement"
      unique_key: "canonical_name"
      properties: ["canonical_name", "name", "id", "source_ids", "chunk_ids", "extractor_version", "variants"]
      # `gloss` и `emitted` добавлены вместе с генератором инструкции (2026-09-29).
      # `properties` - свойства узла в графе, и среди них служебные: `source_ids`,
      # `chunk_ids`, `extractor_version`, `variants` проставляет система, и просить их
      # у модели бессмысленно - она не знает про них ничего и заполнит выдумкой.
      # Поэтому "ч��о модель выдаёт" объявлено отдельно, а не выведено из properties.
      gloss: "правило или ограничение, предъявляемое к системе"
      emitted: ["canonical_name", "name", "id"]
    - type: "Concept"
      unique_key: "canonical_name"
      properties: ["canonical_name", "aliases", "description", "source_ids", "chunk_ids", "extractor_version", "variants"]
      gloss: "система, понятие или термин предметной области"
      emitted: ["canonical_name", "aliases", "description"]
    - type: "Contract"
      unique_key: "canonical_name"
      properties: ["canonical_name", "name", "id", "category", "source_ids", "chunk_ids", "extractor_version", "variants"]
      gloss: "интерфейс, API или внешний контракт"
      emitted: ["canonical_name", "name", "id", "category"]
  edge_types:
    - from: "Requirement"
      to: "Concept"
      type: "REQUIRES_CONSTRAINT"
    - from: "Requirement"
      to: "Requirement"
      type: "CONTRADICTS"
    - from: "Concept"
      to: "Concept"
      type: "SIMILAR_TO"
    - from: "Concept"
      to: "Contract"
      type: "REFERENCES"
  # Связка осей (L2-04): ребро Chunk -> доменная сущность строится Python-кодом на
  # COMMIT из chunk_ids сущности; LLM это ребро не извлекает и не видит Chunk.
  chunk_entity_edge: "MENTIONS"

extraction:
  llm_enabled: true
  prompt_template:
    id: "extract_it_v1"
    system: "Извлеки сущности и связи из текста по доменной онтологии it. Тип нормируется по тексту документа, не по контексту вопроса. Текст документа не возвращай — только JSON с сущностями и связями."
    # `user` — это ТОЛЬКО метод: как думать и как отвечать. Схема (типы сущностей, поля,
    # виды связей, скелет JSON) генерируется из `ontology` при сборке инструкции и
    # повторять её здесь нельзя: именно это дублирование не проверялось ни одним тестом,
    # и вид связи, добавленный в `edge_types` и забытый здесь, оказывался объявленным и
    # никогда не извлекаемым. Ключ называется `user` по историческим причинам; смысл его
    # теперь — «пользовательская часть инструкции, без схемы».
    user: |
      Извлеки из текста документа сущности и связи по онтологии домена.
      Верни ТОЛЬКО валидный JSON-объект со списками сущностей и relationships.

      Правила:
      - Элементы списков сущностей — ОБЪЕКТЫ, не строки. Обязательное поле — canonical_name
        (каноническая форма имени сущности).
      - Поле tag_id НЕ возвращай, и не придумывай аналогов под другими именами
        (entity_id, uid, key). Идентичность сущности вычисляет платформа из
        канонического имени (L1-05): её идентификатор не восстанавливается из текста
        и не принадлежит модели. Поле id — это идентификатор, ПРОЧИТАННЫЙ из
        текста документа, а не назначенный тобой.
      - Текст документа НЕ возвращай: поле text и любые цитаты/фрагменты чанка запрещены —
        текст хранится отдельно и связывается с сущностью на стороне платформы.
      - relationships — отдельный список связей. В полях from/to указывай canonical_name
        ТОЧНО ТАК, как ты объявил эту сущность в списках выше: тем же текстом, с тем же
        написанием. Не переименовывай сущность, не добавляй к имени нумерацию и префиксы,
        не подставляй словесное описание вместо имени.
      - Поле kind у связи ОБЯЗАТЕЛЬНО: без него связь не считается извлечённой.
        Направление соблюдай: Requirement -> Concept, Concept -> Contract.
      - Порядок действий, когда в тексте встретилась сущность, которую ты ещё не объявил:
        сначала объяви её в соответствующем списке, и только потом используй её как конец
        связи. Не выдумывай имя, которого нет в тексте.
      - Пример формы связи (имена — такие же, как в тексте документа, без нумерации):
        "relationships": [{"from": "CACHE_LIMIT", "to": "CACHE_EVICTION",
                           "kind": "REQUIRES_CONSTRAINT", "confidence": 0.9}]
      - Если связей в тексте нет — верни "relationships": [].
      - Отвечай только JSON, без пояснений и без markdown-fence.

validation:
  # Правила декларативны: код их не исполняет (исполнение — Стадия 8, BLG-02).
  # Ключ идентичности доменных сущностей — canonical_name (Вариант А, Стадия 7).
  rules:
    - id: "entity_must_have_canonical_name"
      severity: "error"
      cypher: |
        MATCH (n)
        WHERE (n:Requirement OR n:Concept OR n:Contract) AND n.canonical_name IS NULL
        RETURN n
    - id: "requires_constraint_no_target"
      severity: "warning"
      cypher: |
        MATCH (r:Requirement)-[:REQUIRES_CONSTRAINT]->(c:Concept)
        WHERE c IS NULL RETURN r

canonicalization:
  # Слои трансформации ключа идентичности (ADR-007). Реализованы в коде единой
  # функцией `orchestrator._identity_key`: unicode (NFKC) + yo_fold (ё→е) +
  # trim_lower (casefold + сжатие пробелов). Слой glossary остаётся в NORMALIZE
  # (разрешение синонимов через Glossary Service).
  nodes:
    Concept:
      layers: ["unicode", "yo_fold", "glossary", "trim_lower"]
    Requirement:
      layers: ["unicode", "yo_fold", "trim_lower"]
    Contract:
      layers: ["unicode", "yo_fold", "trim_lower"]

chunking:
  # Стадия 7: параметры стратегий читаются декларативно из этой секции
  # (`ctx.profile.chunking` → build_chunker_from_profile). Полный динамический
  # конфигуратор профилей — Стадия 8, BLG-02. Precedence: env > профиль >
  # namespaces.yaml > константы кода (последний резерв для offline/тестов).
  strategy: "sliding_window"
  chunk_size: 512
  overlap: 64
  langchain_splitter: "recursive"
  llamaindex_parser: "sentence"
  chunk_size_by_type:
    default: 512
    # book/schema/poem — стратегии по типам источников (заполняется по факту)

context_assembly:
  template:
    id: "context_it_v1"
    priorities:
      - "graph"
      - "vector"
  eviction: "drop_lowest_reranker_score"

retrieval:
  # L1/L2 query (GraphRetriever): MATCH по извлечённым терминам + один хоп рёбер.
  # {node_labels} подставляется из ontology.node_types в runtime (build_cypher);
  # подмножество Cypher — см. InMemoryGraphStore (ограниченная грамматика).
  # Тумблер графовой оси: false — только векторный поиск (env RETRIEVAL_GRAPH_ENABLED перекрывает).
  graph_search_enabled: true
  # Глубина обхода по умолчанию: середина допустимого диапазона 1..6, а не «максимум,
  # к которому стремимся». Решение владельца 2026-09-29. Документированная партономия
  # (страна -> область -> район -> город -> улица -> дом) требует 5 хопов от дома до
  # страны, то есть дефолт 3 её НЕ открывает - она включается запросом или повышением
  # этого числа. Значение - намерение, а не ограничение сверху: потолок живёт в
  # MAX_EXPANSION_DEPTH, и зажим объявляется в трассировке (`depth_clamped`).
  # Кодовый фолбэк (2) ниже намеренно меньше: профиль не загрузился - лучше меньше
  # контекста, чем больше.
  max_depth: 3
  cypher_template: |
    MATCH (n) WHERE any(t IN $terms WHERE toLower(n.canonical_name) CONTAINS toLower(t) OR toLower(n.name) CONTAINS toLower(t) OR toLower(n.id) CONTAINS toLower(t))
    OPTIONAL MATCH (n)-[r]-(m) WHERE m:{node_labels}
    RETURN n, m, type(r) AS rel_type
    LIMIT $max_nodes
