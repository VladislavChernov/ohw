# Domain Profile: cinema (пример расширения, docs/01 §1)
# Источник: docs/01 §2; docs/04 §4 (glossary.cinema.yaml — terms фильмы,
#           director_aliases, genre_aliases).
# Каркас: секции обязательны, содержимое наполняется при калибровке.

profile:
  name: "cinema"
  description: "Кино: фильмы, режиссёры, жанры, рекомендации"
  language: "ru"
  version: "1"

ontology:
  node_types:
    - type: "Movie"
      unique_key: "canonical_name"
      # `gloss` и `emitted` добавлены вместе с генератором инструкции (2026-09-29),
      # см. `domain_profile.it.yaml`: пояснения и «что выдаёт модель» живут в данных.
      gloss: "фильм; ремейки и сиквелы - SIMILAR_TO, а не тот же объект"
      emitted: ["canonical_name", "name"]
    - type: "Director"
      unique_key: "canonical_name"
      gloss: "режиссёр; варианты написания имени склеиваются глоссарием"
      emitted: ["canonical_name"]
    - type: "Genre"
      unique_key: "canonical_name"
      gloss: "жанр или тематическая категория"
      emitted: ["canonical_name"]
  chunk_entity_edge: "MENTIONS"
  edge_types:
    - from: "Director"
      to: "Movie"
      type: "DIRECTED"
    - from: "Movie"
      to: "Genre"
      type: "BELONGS_TO"
    - from: "Movie"
      to: "Movie"
      type: "SIMILAR_TO"

extraction:
  llm_enabled: false
  prompt_template:
    id: "extract_cinema_v1"
    system: "Извлеки сущности и связи по онтологии cinema (фильмы, режиссёры, жанры)."

validation:
  rules: []

# Секция `canonicalization` удалена вместе с мёртвым содержимым `canonicalization.nodes`
# (бандл tidy-domain-profile-keys, 61050ae). Оставленный ключ без тела даёт в YAML `None`,
# а не маппинг, и профиль целиком переставал грузиться: Config Service отвечал 422, и
# query-контур не мог получить профиль домена. Слои трансформации ключа идентичности
# (ADR-007) реализованы в коде — `orchestrator._identity_key`.
chunking:
  strategy: "sliding_window"
  chunk_size: 512
  overlap: 64

context_assembly:
  eviction: "drop_lowest_reranker_score"

retrieval:
  # L1/L2 query (GraphRetriever): MATCH по извлечённым терминам + один хоп рёбер.
  # {node_labels} подставляется из ontology.node_types в runtime (build_cypher);
  # подмножество Cypher — см. InMemoryGraphStore (ограниченная грамматика).
  # Тумблер графовой оси: false — только векторный поиск (env RETRIEVAL_GRAPH_ENABLED перекрывает).
  graph_search_enabled: true
  # Глубина обхода по умолчанию: середина допустимого диапазона 1..6 (решение владельца
  # 2026-09-29). Потолок живёт в MAX_EXPANSION_DEPTH, а не здесь; зажим объявляется в
  # трассировке (`depth_clamped`). Кодовый фолбэк (2) ниже намеренно меньше.
  max_depth: 3
