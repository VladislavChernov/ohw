services:
  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    ports:
      - "11434:11434"
    environment:
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5:7b-instruct}
    volumes:
      - ollama_models:/root/.ollama
    entrypoint:
      - /bin/sh
      - -c
      - |
        ollama serve &
        server=$$!
        until ollama ls >/dev/null 2>&1; do sleep 1; done
        if ollama ls | awk '{print $$1}' | grep -Fxq "$$OLLAMA_MODEL"; then
          echo "model ready: $$OLLAMA_MODEL"
        else
          echo "pulling '$$OLLAMA_MODEL' (one-time download)..."
          ollama pull "$$OLLAMA_MODEL"
        fi
        wait $$server
    healthcheck:
      test: ["CMD-SHELL", "ollama show \"$$OLLAMA_MODEL\" >/dev/null 2>&1"]
      interval: 5s
      timeout: 3s
      retries: 60
      start_period: 15s
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  app:
    build: .
    restart: "no"
    command: ["--count", "10"]
    environment:
      OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5:7b-instruct}
    volumes:
      - ./input:/data/input
      - ./output:/data/output
    depends_on:
      ollama:
        condition: service_healthy

volumes:
  ollama_models:
